---
layout: page
title: Tags
permalink: /tags/
---

<div class="tags-page">
    <p>Browse posts by topic.</p>

    {% assign sorted_tags = site.tags | sort %}
    <ul class="tag-cloud">
        {% for tag in sorted_tags %}
        <li>
            <a href="{{ '/tags/' | append: tag[0] | slugify | relative_url }}">
                {{ tag[0] }} <span class="tag-count">({{ tag[1] | size }})</span>
            </a>
        </li>
        {% endfor %}
    </ul>
</div>
